<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まどそうじゲーム｜babuuu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Jost:wght@500;600&display=swap');

  :root{
    --frame-wood:#C68A46;
    --frame-wood-dark:#9C6530;
    --frame-wood-light:#E0AE73;
    --fog-1:#B7C2D9;
    --fog-2:#DCE3EF;
    --sun:#FFB648;
    --sun-core:#FFF3D6;
    --panel-ring:#FFFFFF;
    --ink:#000000;
    --on-dark:#FFFFFF;
    --card-bg:#FFFFFF;
    --wrong:#D97757;
    --pink:#FF4C86;
    --pink-soft:#FFD9E6;
    --blue:#1E9FD6;
    --yellow:#FFC300;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    background:var(--blue);
    color:var(--on-dark);
    font-family:'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    padding:22px 20px 32px;
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }

  .intro{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .eyebrow{
    margin:0;
    font-size:16px;
    font-weight:700;
    letter-spacing:.06em;
    color:var(--on-dark);
  }
  h1{
    margin:0;
    font-family:'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
    font-weight:900;
    font-size:clamp(32px,9vw,42px);
    text-wrap:balance;
    color:var(--on-dark);
  }
  .lead{
    margin:0;
    font-size:18px;
    font-weight:500;
    line-height:1.8;
    color:var(--on-dark);
    max-width:32ch;
    margin-inline:auto;
  }

  .progress-dots{
    display:flex;
    align-items:center;
    gap:11px;
  }
  .dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:transparent;
    border:2.5px solid rgba(255,255,255,.55);
    transition:all .25s ease;
  }
  .dot.done{ background:var(--on-dark); border-color:var(--on-dark); }
  .dot.current{ transform:scale(1.4); border-color:var(--on-dark); }
  .dot.bonus{ border-radius:40% 60% 55% 45%; }

  .window-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .sun-gauge{
    position:absolute;
    top:-16px;
    right:6px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--sun-core), var(--sun) 70%);
    box-shadow:0 0 0 4px var(--panel-ring), 0 0 calc(6px + 22px * var(--p,0)) rgba(255,182,72, calc(.35 + .5 * var(--p,0)));
    transform:scale(calc(.72 + .34 * var(--p,0)));
    transition:transform .25s ease, box-shadow .25s ease;
    z-index:5;
  }

  .frame{
    position:relative;
    width:min(250px, 62vw);
    aspect-ratio:4/5;
    padding:12px;
    border-radius:14px;
    background:linear-gradient(155deg, var(--frame-wood-light), var(--frame-wood) 55%, var(--frame-wood-dark));
    box-shadow:0 14px 30px -14px rgba(60,40,10,.4), inset 0 0 0 2px rgba(255,255,255,.15);
  }

  .glass{
    position:relative;
    width:100%;
    height:100%;
    border-radius:6px;
    overflow:hidden;
    background:#DCE9F2;
    touch-action:none;
    cursor:grab;
  }
  .glass:active{cursor:grabbing;}

  .scene{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .fog{ position:absolute; inset:0; width:100%; height:100%; display:block; transition:opacity .5s ease; }

  .hint{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:1; transition:opacity .4s ease; z-index:3;
  }
  .hint.hidden{opacity:0;}
  .hint-inner{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .hint svg{width:44%;height:44%;}
  .hint-label{
    margin:0; font-weight:900; font-size:14px; color:var(--ink);
    background:#FFFFFF; padding:6px 16px; border-radius:999px;
    white-space:nowrap;
  }
  .hint-arrow{
    fill:none; stroke:rgba(62,50,38,.5); stroke-width:3; stroke-linecap:round;
    stroke-dasharray:6 8; animation:dash 2.4s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .hint-arrow{animation:none;} }
  @keyframes dash{to{stroke-dashoffset:-140;}}

  .mullion{ position:absolute; inset:0; z-index:4; pointer-events:none; }
  .mullion::before,.mullion::after{
    content:''; position:absolute;
    background:linear-gradient(180deg, var(--frame-wood-light), var(--frame-wood-dark));
  }
  .mullion::before{ left:calc(50% - 3px); top:0; width:6px; height:100%; }
  .mullion::after{ top:calc(50% - 3px); left:0; height:6px; width:100%; }

  .rainbow-layer{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  .rainbow-layer.show{opacity:1;}
  .rainbow-arc{
    fill:none; stroke-linecap:round;
    stroke-dasharray:420; stroke-dashoffset:420;
    transition:stroke-dashoffset 1.1s ease;
  }
  .rainbow-layer.show .rainbow-arc{stroke-dashoffset:0;}

  .answer-stamp{
    position:absolute; inset:0; z-index:8;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0;
    transform:scale(.7) rotate(-8deg);
    transition:opacity .25s ease, transform .25s ease;
  }
  .answer-stamp.show{ opacity:1; transform:scale(1) rotate(-8deg); }
  .answer-stamp span{
    background:#FFFFFF; color:var(--pink);
    border:5px solid var(--pink);
    border-radius:999px;
    padding:14px 22px;
    font-weight:900; font-size:20px;
    white-space:nowrap;
    box-shadow:0 14px 26px -10px rgba(0,0,0,.45);
  }
  @media (prefers-reduced-motion: reduce){ .answer-stamp{ transition:none; transform:none; } .answer-stamp.show{ transform:none; } }

  .petals{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:6; }
  .petal{
    position:absolute; top:-14px; width:10px; height:10px;
    border-radius:2px 8px; opacity:.95; animation:fall linear forwards;
  }
  @keyframes fall{ to{ transform:translateY(400px) rotate(300deg); opacity:.2; } }
  @media (prefers-reduced-motion: reduce){ .petal{animation:none; opacity:0;} }

  .sill{
    width:min(250px, 62vw); height:14px; margin-top:-4px;
    border-radius:0 0 8px 8px;
    background:linear-gradient(180deg, var(--frame-wood), var(--frame-wood-dark));
    box-shadow:0 6px 10px -6px rgba(60,40,10,.5);
    position:relative;
  }
  .pot{ position:absolute; left:14px; bottom:10px; width:26px; height:20px; }
  .pot::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg,#D98B6B,#B5623E);
    clip-path:polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
  }
  .pot::after{
    content:''; position:absolute; left:2px; right:2px; top:-11px; height:14px;
    background:radial-gradient(circle at 30% 30%, #7E8F53, #5E6C3E 75%);
    border-radius:50% 50% 40% 40%;
  }

  .controls{ display:flex; justify-content:center; }
  .ghost-btn{
    font-size:12.5px; font-weight:500; color:var(--on-dark);
    background:transparent; border:1.5px dashed rgba(255,255,255,.6); border-radius:999px;
    padding:5px 14px; cursor:pointer;
  }
  .ghost-btn:hover{ border-color:var(--on-dark); }
  .ghost-btn:focus-visible, .next-btn:focus-visible, .cta-btn:focus-visible, .choice:focus-visible, .reset-btn:focus-visible, .reveal-btn:focus-visible{
    outline:3px solid var(--sun); outline-offset:2px;
  }

  .quiz{
    width:min(360px, 94vw);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .quiz-q{ margin:0; font-weight:700; font-size:17px; color:var(--on-dark); }
  .choices{
    display:flex; flex-wrap:nowrap; justify-content:center; gap:8px;
    width:100%;
  }
  .choice{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    flex:1 1 0; min-width:0; max-width:112px;
    padding:10px 4px 8px;
    background:var(--card-bg);
    border:2px solid #F0E6F5;
    border-radius:16px;
    cursor:pointer;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink);
    box-shadow:0 8px 16px -12px rgba(60,40,10,.3);
  }
  .choice span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .choice:hover{ border-color:var(--sun); }
  .choice svg{ width:34px; height:34px; }
  .choice.wrong{ animation:shake .4s ease; border-color:var(--wrong); }
  @media (prefers-reduced-motion: reduce){ .choice.wrong{animation:none; border-color:var(--wrong);} }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .quiz-feedback{ min-height:22px; margin:0; font-size:14px; font-weight:500; color:var(--on-dark); }
  .quiz-feedback.good{ font-weight:900; }
  .quiz-feedback.oops{
    display:inline-block; font-weight:900; font-size:15px; color:#fff;
    background:var(--wrong); padding:6px 16px; border-radius:999px;
  }

  .round-clear{
    width:min(320px, 82vw);
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .round-clear-label{ margin:0; font-weight:700; font-size:22px; color:var(--on-dark); }
  .next-btn{
    font-weight:700; font-size:16px;
    color:#000000; background:var(--sun); border:none;
    padding:12px 28px; border-radius:999px; cursor:pointer;
    box-shadow:0 10px 18px -10px rgba(255,182,72,.8);
  }

  .coupon-reveal{
    width:min(320px, 82vw);
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .coupon-reveal p{ margin:0; font-size:17px; font-weight:500; color:var(--on-dark); animation:pulse 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .coupon-reveal p{animation:none;} }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }

  .result{
    width:min(360px, 86vw);
    background:var(--card-bg);
    border-radius:20px;
    padding:26px 26px 26px;
    text-align:center;
    box-shadow:0 16px 34px -18px rgba(60,40,10,.32);
    display:flex; flex-direction:column; gap:12px; align-items:center;
  }
  .result-title{ margin:0; font-weight:900; font-size:28px; color:var(--ink); }
  .result-coupon{ margin:0; font-size:15px; color:var(--ink); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; }
  .coupon-badge{
    display:inline-flex; align-items:baseline; gap:2px;
    background:var(--pink-soft); color:var(--ink);
    font-weight:700; font-size:15px;
    padding:5px 14px; border-radius:999px;
  }
  .coupon-badge .num{ font-family:'Jost', sans-serif; font-weight:600; font-size:18px; }
  .result-body{ margin:0; font-size:16px; line-height:1.75; color:var(--ink); }
  .result-actions{ margin-top:6px; display:flex; flex-direction:column; gap:12px; width:100%; align-items:center; }
  .cta-btn{
    display:inline-block; width:100%; max-width:270px; text-align:center; text-decoration:none;
    background:var(--sun); color:#000000; font-weight:700; font-size:17px;
    padding:14px 18px; border-radius:999px;
    box-shadow:0 10px 18px -10px rgba(255,182,72,.8);
  }
  .coupon-get-btn{
    background:var(--pink); color:#fff;
    box-shadow:0 10px 18px -10px rgba(255,76,134,.7);
  }
  .reset-btn{
    background:none; border:none; font-size:14px; font-weight:500;
    color:var(--ink); text-decoration:underline; cursor:pointer; padding:4px;
  }
  .note{ margin:0; font-size:12.5px; color:var(--ink); }
</style>
</head>

<div class="page">
  <div class="intro">
    <h1>まどそうじゲーム</h1>
    <p class="lead" id="leadText">まどを なぞって、かくれている ものを あててみよう。</p>
  </div>

  <div class="progress-dots" id="progressDots" aria-hidden="true"></div>

  <div class="window-wrap">
    <div class="sun-gauge" id="sunGauge" aria-hidden="true"></div>
    <div class="frame">
      <div class="glass" id="glass">
        <svg class="scene" id="sceneSvg" viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        <canvas class="fog" id="fogCanvas"></canvas>
        <div class="hint" id="hint">
          <div class="hint-inner">
            <svg viewBox="0 0 100 100">
              <path class="hint-arrow" d="M28 34 C 20 55, 35 74, 55 70 C 72 66, 78 48, 68 36 C 60 26, 45 28, 42 40" />
            </svg>
            <p class="hint-label">くもりを ふきふき</p>
          </div>
        </div>
        <div class="rainbow-layer" id="rainbowLayer">
          <svg viewBox="0 0 320 400" preserveAspectRatio="none">
            <path class="rainbow-arc" d="M20 210 A 150 150 0 0 1 300 210" stroke="#EF9D8F" stroke-width="8" transform="translate(0,-14)"/>
            <path class="rainbow-arc" d="M20 210 A 150 150 0 0 1 300 210" stroke="#F6C877" stroke-width="8" transform="translate(0,-2)"/>
            <path class="rainbow-arc" d="M20 210 A 150 150 0 0 1 300 210" stroke="#8FBF8A" stroke-width="8" transform="translate(0,10)"/>
            <path class="rainbow-arc" d="M20 210 A 150 150 0 0 1 300 210" stroke="#7FB8D9" stroke-width="8" transform="translate(0,22)"/>
          </svg>
        </div>
        <div class="petals" id="petals" aria-hidden="true"></div>
        <div class="answer-stamp" id="answerStamp" aria-hidden="true"><span id="answerStampText"></span></div>
      </div>
      <div class="mullion" aria-hidden="true"></div>
    </div>
    <div class="sill"><div class="pot"></div></div>
  </div>

  <div class="controls" id="wipingControls">
    <button class="ghost-btn" id="autoWipeBtn" type="button">ゆびで なぞれないときは ここをタップ</button>
  </div>

  <div class="quiz" id="quizPanel" hidden>
    <p class="quiz-q">これは なにかな？</p>
    <div class="choices" id="choices"></div>
    <p class="quiz-feedback" id="quizFeedback" aria-live="polite"></p>
  </div>

  <div class="round-clear" id="roundClear" hidden>
    <p class="round-clear-label" id="roundClearLabel"></p>
    <button class="next-btn" id="nextBtn" type="button"></button>
  </div>

  <div class="coupon-reveal" id="couponReveal" hidden>
    <p>まどの むこうに クーポンが かくれてるよ</p>
  </div>

  <div class="result" id="result" hidden>
    <p class="result-title" id="resultTitle"></p>
    <p class="result-coupon" id="resultCoupon"></p>
    <p class="result-body">秋のおでかけ日和。ママといっしょに おそとへ行こう。</p>
    <div class="result-actions">
      <a class="cta-btn coupon-get-btn" href="#" target="_blank" rel="noopener" id="couponGetBtn" hidden>クーポンを受け取る</a>
      <a class="cta-btn" href="index.html#shopping" target="_top" id="ctaBtn">おでかけアイテムを見る</a>
      <button class="reset-btn" id="resetBtn" type="button">もういちど あそぶ</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ==========================================================
  // ▼▼▼ クーポンのリンク設定（ここに3種類のURLを貼ってください） ▼▼▼
  // 1等・2等・3等それぞれの「クーポンを取得する」ページのURLを
  // ""の中に貼り付けてください（例: 'https://item.rakuten.co.jp/...'）。
  // 空のままだと「クーポンを受け取る」ボタンは表示されません。
  var COUPON_URLS = {
    first:  'https://coupon.rakuten.co.jp/getCoupon?getkey=SjhGUC1WWVdVLVVXVlctVU1NVA--&rt=',  // 1等（100円OFF）のクーポン取得URL
    second: 'https://coupon.rakuten.co.jp/getCoupon?getkey=SE5RWS1OUEJFLUkwUkktQVJPRA--&rt=',  // 2等（55円OFF）のクーポン取得URL
    third:  'https://coupon.rakuten.co.jp/getCoupon?getkey=SklVQi1QOEJRLTZZTE0tSEZGVg--&rt='   // 3等（39円OFF）のクーポン取得URL
  };
  // ▲▲▲ ここまで ▲▲▲
  // ==========================================================

  var glass = document.getElementById('glass');
  var canvas = document.getElementById('fogCanvas');
  var ctx = canvas.getContext('2d');
  var hint = document.getElementById('hint');
  var sunGauge = document.getElementById('sunGauge');
  var rainbowLayer = document.getElementById('rainbowLayer');
  var petalsWrap = document.getElementById('petals');
  var answerStamp = document.getElementById('answerStamp');
  var answerStampText = document.getElementById('answerStampText');
  var resultPanel = document.getElementById('result');
  var resultTitle = document.getElementById('resultTitle');
  var resultCoupon = document.getElementById('resultCoupon');
  var autoWipeBtn = document.getElementById('autoWipeBtn');
  var wipingControls = document.getElementById('wipingControls');
  var resetBtn = document.getElementById('resetBtn');
  var couponGetBtn = document.getElementById('couponGetBtn');
  var progressDots = document.getElementById('progressDots');
  var sceneSvg = document.getElementById('sceneSvg');
  var quizPanel = document.getElementById('quizPanel');
  var choicesWrap = document.getElementById('choices');
  var quizFeedback = document.getElementById('quizFeedback');
  var roundClear = document.getElementById('roundClear');
  var roundClearLabel = document.getElementById('roundClearLabel');
  var nextBtn = document.getElementById('nextBtn');
  var couponReveal = document.getElementById('couponReveal');

  var FRUITS = ['strawberry','apple','orange','banana','grape','peach'];
  var ANIMALS = ['bear','cat','dog','rabbit','squirrel','elephant'];
  var LABELS = {
    strawberry:'いちご', apple:'りんご', orange:'みかん', banana:'ばなな', grape:'ぶどう', peach:'もも',
    bear:'くま', cat:'ねこ', dog:'いぬ', rabbit:'うさぎ', squirrel:'りす', elephant:'ぞう'
  };
  var ROUND_BG = ['#1E9FD6','#FF4C86','#FFC300','#1E9FD6'];

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildRounds(){
    var picks = shuffle(shuffle(FRUITS).slice(0, 2).concat(shuffle(ANIMALS).slice(0, 2)));
    var rounds = picks.map(function(id, i){
      var pool = FRUITS.indexOf(id) !== -1 ? FRUITS : ANIMALS;
      var distractorPool = pool.filter(function(pid){ return picks.indexOf(pid) === -1; });
      var choices = [id].concat(shuffle(distractorPool).slice(0, 2)).map(function(cid){
        return { id:cid, label:LABELS[cid] };
      });
      return { type:'quiz', id:id, label:LABELS[id], bg:ROUND_BG[i], choices:choices };
    });
    rounds.push({ type:'coupon' });
    return rounds;
  }

  var ROUNDS = buildRounds();

  function mysteryScene(){
    return ''
      + '<rect width="320" height="400" fill="#FF4C86"/>'
      + '<g fill="#FFFFFF" opacity="0.35">'
      + '<circle cx="60" cy="80" r="10"/><circle cx="250" cy="60" r="7"/><circle cx="270" cy="300" r="9"/><circle cx="50" cy="320" r="6"/>'
      + '</g>'
      + '<rect x="85" y="125" width="150" height="160" rx="18" fill="#FFFFFF"/>'
      + '<text x="160" y="235" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-weight="900" font-size="90" fill="#000000">?</text>';
  }

  function topScene(){
    return ''
      + '<rect width="320" height="400" fill="#FFD34E"/>'
      + '<g stroke="#FFFFFF" stroke-width="7" opacity="0.6" stroke-linecap="round">'
      + '<line x1="160" y1="200" x2="160" y2="20"/><line x1="160" y1="200" x2="300" y2="70"/>'
      + '<line x1="160" y1="200" x2="300" y2="330"/><line x1="160" y1="200" x2="160" y2="380"/>'
      + '<line x1="160" y1="200" x2="20" y2="330"/><line x1="160" y1="200" x2="20" y2="70"/>'
      + '<line x1="160" y1="200" x2="250" y2="30"/><line x1="160" y1="200" x2="250" y2="370"/>'
      + '<line x1="160" y1="200" x2="70" y2="30"/><line x1="160" y1="200" x2="70" y2="370"/>'
      + '</g>'
      + '<g transform="translate(160,205)">'
      + '<path d="M0 -92 L21 -33 L84 -28 L35 9 L52 70 L0 35 L-52 70 L-35 9 L-84 -28 L-21 -33 Z" fill="#FF4C86"/>'
      + '<circle r="54" fill="#FFFFFF"/>'
      + '<text y="7" text-anchor="middle" font-family="Jost, sans-serif" font-weight="600" font-size="32" fill="#000000">100</text>'
      + '</g>'
      + '<g fill="#1E9FD6"><circle cx="50" cy="55" r="7"/><circle cx="272" cy="80" r="6"/><circle cx="258" cy="335" r="7"/><circle cx="40" cy="322" r="6"/><circle cx="195" cy="35" r="5"/><circle cx="115" cy="372" r="5"/></g>'
      + '<g fill="#FF4C86"><circle cx="82" cy="32" r="5"/><circle cx="232" cy="42" r="5"/><circle cx="276" cy="248" r="5"/><circle cx="52" cy="262" r="5"/></g>';
  }

  function hitScene(){
    return ''
      + '<rect width="320" height="400" fill="#FFC300"/>'
      + '<g stroke="#FFFFFF" stroke-width="6" opacity="0.55" stroke-linecap="round">'
      + '<line x1="160" y1="200" x2="160" y2="40"/><line x1="160" y1="200" x2="290" y2="90"/>'
      + '<line x1="160" y1="200" x2="290" y2="310"/><line x1="160" y1="200" x2="160" y2="360"/>'
      + '<line x1="160" y1="200" x2="30" y2="310"/><line x1="160" y1="200" x2="30" y2="90"/>'
      + '</g>'
      + '<g transform="translate(160,205)">'
      + '<path d="M0 -78 L18 -28 L72 -24 L30 8 L44 60 L0 30 L-44 60 L-30 8 L-72 -24 L-18 -28 Z" fill="#FF4C86"/>'
      + '<circle r="46" fill="#FFFFFF"/>'
      + '<text y="6" text-anchor="middle" font-family="Jost, sans-serif" font-weight="600" font-size="30" fill="#000000">55</text>'
      + '</g>'
      + '<g fill="#1E9FD6"><circle cx="55" cy="70" r="6"/><circle cx="270" cy="90" r="5"/><circle cx="255" cy="330" r="6"/><circle cx="45" cy="320" r="5"/></g>'
      + '<g fill="#FF4C86"><circle cx="90" cy="40" r="4"/><circle cx="235" cy="50" r="4"/><circle cx="270" cy="250" r="4"/><circle cx="60" cy="270" r="4"/></g>';
  }

  function missScene(){
    return ''
      + '<rect width="320" height="400" fill="#1E9FD6"/>'
      + '<g fill="#FFFFFF" opacity="0.4"><ellipse cx="80" cy="90" rx="26" ry="13"/><ellipse cx="240" cy="130" rx="22" ry="11"/></g>'
      + '<g transform="translate(160,215) rotate(-4)">'
      + '<rect x="-70" y="-55" width="140" height="110" rx="14" fill="#FFFFFF"/>'
      + '<circle cx="-70" cy="0" r="8" fill="#1E9FD6"/><circle cx="70" cy="0" r="8" fill="#1E9FD6"/>'
      + '<text y="12" text-anchor="middle" font-family="Jost, sans-serif" font-weight="600" font-size="34" fill="#000000">39</text>'
      + '</g>'
      + '<g fill="#FFC300"><circle cx="60" cy="300" r="5"/><circle cx="260" cy="300" r="5"/><circle cx="250" cy="70" r="4"/></g>';
  }

  var COLS = 18, ROWS = 22;
  var grid = new Array(COLS * ROWS).fill(false);
  var roundIndex = 0;
  var wipeLocked = false;
  var roundSettled = false;
  var gameDone = false;
  var couponOutcome = null;
  var isDown = false;
  var lastX = null, lastY = null;
  var dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  var petalColors = ['#FFC300', '#FF4C86', '#1E9FD6', '#FFFFFF'];

  function cssSize(){ var r = glass.getBoundingClientRect(); return { w:r.width, h:r.height }; }
  function sizeCanvas(){
    var s = cssSize();
    canvas.width = Math.round(s.w * dpr);
    canvas.height = Math.round(s.h * dpr);
    canvas.style.width = s.w + 'px';
    canvas.style.height = s.h + 'px';
  }
  function seededRandom(seed){ var x = Math.sin(seed) * 10000; return x - Math.floor(x); }

  function paintFog(){
    var w = canvas.width, h = canvas.height, i;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = getCss('--fog-1');
    ctx.fillRect(0, 0, w, h);
    for(i = 0; i < 26; i++){
      var rx = seededRandom(i * 12.9 + roundIndex) * w;
      var ry = seededRandom(i * 7.7 + 3 + roundIndex) * h;
      var rr = (0.18 + seededRandom(i * 3.1) * 0.22) * w;
      var grad = ctx.createRadialGradient(rx, ry, 0, rx, ry, rr);
      grad.addColorStop(0, hexAlpha(getCss('--fog-2'), 0.55));
      grad.addColorStop(1, hexAlpha(getCss('--fog-2'), 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(rx, ry, rr, 0, Math.PI * 2); ctx.fill();
    }
    for(i = 0; i < 34; i++){
      var dx = seededRandom(i * 5.3 + 1 + roundIndex) * w;
      var dy = seededRandom(i * 9.1 + 2 + roundIndex) * h;
      var dr = (0.01 + seededRandom(i * 2.2) * 0.02) * w;
      var dg = ctx.createRadialGradient(dx, dy - dr, 0, dx, dy, dr * 2.2);
      dg.addColorStop(0, 'rgba(255,255,255,0.5)');
      dg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = dg;
      ctx.beginPath(); ctx.ellipse(dx, dy, dr, dr * 2.2, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function getCss(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hexAlpha(hex, a){
    hex = hex.replace('#','');
    var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function stamp(x, y){
    var radius = canvas.width * 0.1;
    var grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.7, 'rgba(0,0,0,0.95)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
    markGrid(x / canvas.width, y / canvas.height, radius / canvas.width);
  }

  function markGrid(nx, ny, nr){
    var c0 = Math.max(0, Math.floor((nx - nr) * COLS));
    var c1 = Math.min(COLS - 1, Math.ceil((nx + nr) * COLS));
    var r0 = Math.max(0, Math.floor((ny - nr) * ROWS));
    var r1 = Math.min(ROWS - 1, Math.ceil((ny + nr) * ROWS));
    for(var r = r0; r <= r1; r++){
      for(var c = c0; c <= c1; c++){
        var cx = (c + 0.5) / COLS, cy = (r + 0.5) / ROWS;
        var dist = Math.hypot(cx - nx, (cy - ny) * (COLS / ROWS));
        if(dist <= nr) grid[r * COLS + c] = true;
      }
    }
    updateProgress();
  }

  function currentPercent(){
    var count = 0;
    for(var i = 0; i < grid.length; i++) if(grid[i]) count++;
    return count / grid.length;
  }

  function updateProgress(){
    var p = Math.min(1, currentPercent());
    sunGauge.style.setProperty('--p', p.toFixed(3));
    if(!wipeLocked && p >= 0.8) lockWipe();
  }

  function lockWipe(){
    wipeLocked = true;
    canvas.style.opacity = '0';
    hint.classList.add('hidden');
    wipingControls.hidden = true;
    if(ROUNDS[roundIndex].type === 'coupon'){
      couponReveal.hidden = false;
      setTimeout(revealCoupon, 1200);
    }
  }

  function pointFromEvent(e){
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx * dpr, y: cy * dpr };
  }
  function wipeLine(x0, y0, x1, y1){
    var dist = Math.hypot(x1 - x0, y1 - y0);
    var step = canvas.width * 0.035;
    var n = Math.max(1, Math.floor(dist / step));
    for(var i = 0; i <= n; i++){
      var t = i / n;
      stamp(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    }
  }
  function onDown(e){
    if(wipeLocked) return;
    isDown = true;
    hint.classList.add('hidden');
    var p = pointFromEvent(e);
    stamp(p.x, p.y);
    lastX = p.x; lastY = p.y;
    if(glass.setPointerCapture && e.pointerId != null) glass.setPointerCapture(e.pointerId);
    e.preventDefault();
  }
  function onMove(e){
    if(!isDown || wipeLocked) return;
    var p = pointFromEvent(e);
    wipeLine(lastX, lastY, p.x, p.y);
    lastX = p.x; lastY = p.y;
    e.preventDefault();
  }
  function onUp(){ isDown = false; }

  glass.addEventListener('pointerdown', onDown);
  glass.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  glass.addEventListener('touchstart', onDown, { passive:false });
  glass.addEventListener('touchmove', onMove, { passive:false });
  window.addEventListener('touchend', onUp);

  autoWipeBtn.addEventListener('click', function(){
    if(wipeLocked) return;
    hint.classList.add('hidden');
    for(var i = 0; i < 5; i++){
      var rx = (0.15 + Math.random() * 0.7) * canvas.width;
      var ry = (0.15 + Math.random() * 0.7) * canvas.height;
      stamp(rx, ry);
    }
  });

  function spawnPetals(count){
    petalsWrap.innerHTML = '';
    for(var i = 0; i < count; i++){
      var el = document.createElement('div');
      el.className = 'petal';
      el.style.left = (Math.random() * 92) + '%';
      el.style.background = petalColors[i % petalColors.length];
      el.style.animationDuration = (2.2 + Math.random() * 1.4) + 's';
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      petalsWrap.appendChild(el);
    }
  }

  function renderDots(){
    progressDots.innerHTML = '';
    ROUNDS.forEach(function(r, i){
      var d = document.createElement('span');
      d.className = 'dot' + (r.type === 'coupon' ? ' bonus' : '') + (i < roundIndex ? ' done' : '') + (i === roundIndex ? ' current' : '');
      progressDots.appendChild(d);
    });
  }

  function renderScene(round){
    if(round.type === 'coupon'){
      sceneSvg.innerHTML = mysteryScene();
      return;
    }
    sceneSvg.innerHTML = ''
      + '<rect width="320" height="400" fill="' + round.bg + '"/>'
      + '<use href="#ico-' + round.id + '" x="10" y="50" width="300" height="300"/>';
  }

  function renderChoices(round){
    choicesWrap.innerHTML = '';
    quizFeedback.textContent = '';
    quizFeedback.className = 'quiz-feedback';
    shuffle(round.choices).forEach(function(choice){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice';
      btn.innerHTML = '<svg viewBox="0 0 100 100"><use href="#ico-' + choice.id + '"/></svg><span>' + choice.label + '</span>';
      btn.addEventListener('click', function(){ onChoose(choice.id, btn); });
      choicesWrap.appendChild(btn);
    });
  }

  function onChoose(choiceId, btn){
    if(roundSettled) return;
    var round = ROUNDS[roundIndex];
    if(choiceId === round.id){
      var wipedFast = currentPercent() < 0.8;
      roundSettled = true;
      wipeLocked = true;
      canvas.style.opacity = '0';
      hint.classList.add('hidden');
      wipingControls.hidden = true;
      var praise = wipedFast ? 'はやい！せいかい！' : 'せいかい！';
      quizFeedback.textContent = praise;
      quizFeedback.className = 'quiz-feedback good';
      answerStampText.textContent = praise;
      answerStamp.classList.add('show');
      spawnPetals(10);
      setTimeout(function(){
        quizPanel.hidden = true;
        roundClearLabel.textContent = 'やったね、' + round.label + ' みつけた！';
        nextBtn.textContent = (roundIndex === ROUNDS.length - 2) ? 'さいごの まどへ' : 'つぎの まどへ';
        roundClear.hidden = false;
      }, 700);
    } else {
      btn.classList.add('wrong');
      quizFeedback.textContent = 'おしい！もういちど えらんでみてね';
      quizFeedback.className = 'quiz-feedback oops';
      setTimeout(function(){ btn.classList.remove('wrong'); }, 450);
    }
  }

  var COUPON_TIERS = {
    first:  { label:'1等', amount:'100', scene:topScene, petals:22, rainbow:true },
    second: { label:'2等', amount:'55',  scene:hitScene, petals:16, rainbow:true },
    third:  { label:'3等', amount:'39',  scene:missScene, petals:8,  rainbow:false }
  };

  function pickCouponOutcome(){
    var r = Math.random();
    if(r < 0.03) return 'first';
    if(r < 0.63) return 'second';
    return 'third';
  }

  function showCouponResult(outcome){
    var tier = COUPON_TIERS[outcome];
    resultTitle.textContent = tier.label + '！おめでとう！';
    resultCoupon.innerHTML = '<span class="coupon-badge">GOGOクーポン <span class="num">' + tier.amount + '</span>円OFF</span> プレゼント♪';
    var couponUrl = COUPON_URLS[outcome];
    if(couponUrl){
      couponGetBtn.href = couponUrl;
      couponGetBtn.hidden = false;
    } else {
      couponGetBtn.hidden = true;
    }
    resultPanel.hidden = false;
    resultPanel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function revealCoupon(){
    couponReveal.hidden = true;
    var tier = COUPON_TIERS[couponOutcome];
    sceneSvg.innerHTML = tier.scene();
    spawnPetals(tier.petals);
    if(tier.rainbow) rainbowLayer.classList.add('show');
    setTimeout(function(){
      gameDone = true;
      roundIndex = ROUNDS.length;
      renderDots();
      showCouponResult(couponOutcome);
    }, 650);
  }

  function startRound(i){
    roundIndex = i;
    wipeLocked = false;
    roundSettled = false;
    grid.fill(false);
    rainbowLayer.classList.remove('show');
    petalsWrap.innerHTML = '';
    answerStamp.classList.remove('show');
    roundClear.hidden = true;
    couponReveal.hidden = true;
    resultPanel.hidden = true;
    wipingControls.hidden = false;
    hint.classList.remove('hidden');
    if(ROUNDS[i].type === 'coupon') couponOutcome = pickCouponOutcome();
    renderDots();
    renderScene(ROUNDS[i]);
    if(ROUNDS[i].type === 'quiz'){
      renderChoices(ROUNDS[i]);
      quizPanel.hidden = false;
    } else {
      quizPanel.hidden = true;
    }
    sizeCanvas();

    // paint the fresh fog while hidden, then show it instantly (no fade)
    // so the new round's answer never flashes through mid-transition.
    canvas.style.transition = 'none';
    canvas.style.opacity = '0';
    paintFog();
    void canvas.offsetHeight;
    canvas.style.opacity = '1';
    requestAnimationFrame(function(){ canvas.style.transition = 'opacity .5s ease'; });

    sunGauge.style.setProperty('--p', '0');
  }

  nextBtn.addEventListener('click', function(){ startRound(roundIndex + 1); });
  resetBtn.addEventListener('click', function(){ ROUNDS = buildRounds(); startRound(0); });

  window.addEventListener('resize', function(){
    if(wipeLocked) return;
    sizeCanvas();
    paintFog();
  });

  function start(data){
    var initial = (data && typeof data.roundIndex === 'number' && data.roundIndex < ROUNDS.length) ? data.roundIndex : 0;
    startRound(initial);
    if(data && data.done){
      gameDone = true;
      roundIndex = ROUNDS.length;
      renderDots();
      showCouponResult(COUPON_TIERS[data.couponOutcome] ? data.couponOutcome : 'second');
    }
    if(window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot(function(){ return { roundIndex: roundIndex, done: gameDone, couponOutcome: couponOutcome }; });
    }
  }

  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || {});
  }

  function postHeight(){
    if(window.parent !== window){
      window.parent.postMessage({ type:'madoGameHeight', height: document.body.scrollHeight }, '*');
    }
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  new MutationObserver(postHeight).observe(document.body, { childList:true, subtree:true, attributes:true });
})();
</script>
</body>
</html>
