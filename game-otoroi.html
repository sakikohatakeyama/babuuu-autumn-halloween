<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おそろい さがし｜babuuu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Jost:wght@500;600&display=swap');

  :root{
    --bg:#FBF1E8;
    --ink:#4A3B34;
    --rose:#E8A9A0;
    --rose-deep:#D9776B;
    --sage:#9FB495;
    --gold:#C9A15A;
    --card-bg:#FFFFFF;
    --cream:#FFF8F0;
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    padding:26px 20px 34px;
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }

  .intro{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  h1{
    margin:0;
    font-family:'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
    font-weight:900;
    font-size:clamp(26px,7.5vw,34px);
    text-wrap:balance;
    color:var(--ink);
  }
  .lead{
    margin:0;
    font-size:16px;
    font-weight:500;
    line-height:1.8;
    color:var(--ink);
    max-width:30ch;
    margin-inline:auto;
    opacity:.85;
  }

  .tries{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .tries-label{ margin:0; font-size:13px; font-weight:700; color:var(--rose-deep); letter-spacing:.04em; }
  .try-dot{
    width:24px; height:24px;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .25s ease, transform .25s ease;
  }
  .try-dot svg{ width:100%; height:100%; }
  .try-dot.used{ opacity:.3; transform:scale(.85); }

  .board{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    width:min(320px, 88vw);
  }
  .card{
    position:relative;
    aspect-ratio:3/4;
    border-radius:14px;
    cursor:pointer;
    perspective:600px;
    background:none;
    border:none;
    padding:0;
  }
  .card-inner{
    position:relative;
    width:100%; height:100%;
    border-radius:14px;
    transition:transform .5s cubic-bezier(.2,.7,.2,1);
    transform-style:preserve-3d;
    box-shadow:0 8px 16px -10px rgba(74,59,52,.35);
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card-face{
    position:absolute; inset:0;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden;
    overflow:hidden;
  }
  .card-back{
    background:
      radial-gradient(circle at 50% 50%, var(--rose) 0 3px, transparent 3.5px) 0 0/16px 16px,
      var(--cream);
    border:2px solid var(--rose);
  }
  .card-back::after{
    content:'✦';
    color:var(--rose-deep);
    font-size:20px;
  }
  .card-front{
    background:var(--card-bg);
    border:2px solid var(--gold);
    transform:rotateY(180deg);
    padding:8px;
  }
  .card-front img{ width:100%; height:100%; object-fit:contain; }
  .card-front .placeholder{
    width:100%; height:100%;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    color:var(--rose-deep);
    font-weight:900;
    font-size:22px;
    font-family:'Jost',sans-serif;
  }
  .card.matched .card-inner{ opacity:.45; }
  .card:disabled{ cursor:default; }
  .card.wrong .card-inner{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:rotateY(180deg) translateX(0); }
    25%{ transform:rotateY(180deg) translateX(-4px); }
    75%{ transform:rotateY(180deg) translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
    .card.wrong .card-inner{ animation:none; }
  }

  .feedback{ min-height:24px; margin:0; font-size:15px; font-weight:700; color:var(--rose-deep); }

  .stage-wrap{ display:flex; flex-direction:column; align-items:center; }
  .stage{
    position:relative;
    width:min(240px, 60vw);
    aspect-ratio:4/5;
    border-radius:24px;
    overflow:hidden;
    background:var(--cream);
    box-shadow:0 14px 30px -14px rgba(74,59,52,.4);
  }
  .scene{ position:absolute; inset:0; width:100%; height:100%; display:block; }

  .petals{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:6; }
  .petal{
    position:absolute; top:-14px; width:9px; height:9px;
    border-radius:2px 8px; opacity:.95; animation:fall linear forwards;
  }
  @keyframes fall{ to{ transform:translateY(360px) rotate(300deg); opacity:.2; } }
  @media (prefers-reduced-motion: reduce){ .petal{animation:none; opacity:0;} }

  .reveal-wait{
    width:min(320px, 82vw);
    text-align:center;
  }
  .reveal-wait p{ margin:0; font-size:16px; font-weight:700; color:var(--rose-deep); animation:pulse 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .reveal-wait p{animation:none;} }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }

  .result{
    width:min(360px, 86vw);
    background:var(--card-bg);
    border-radius:20px;
    padding:26px;
    text-align:center;
    box-shadow:0 16px 34px -18px rgba(74,59,52,.32);
    display:flex; flex-direction:column; gap:12px; align-items:center;
  }
  .result-title{ margin:0; font-weight:900; font-size:26px; color:var(--ink); }
  .result-coupon{ margin:0; font-size:15px; color:var(--ink); display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px; }
  .coupon-badge{
    display:inline-flex; align-items:baseline; gap:2px;
    background:#FBE4DF; color:var(--rose-deep);
    font-weight:700; font-size:15px;
    padding:5px 14px; border-radius:999px;
  }
  .coupon-badge .num{ font-family:'Jost', sans-serif; font-weight:600; font-size:18px; }
  .result-body{ margin:0; font-size:15.5px; line-height:1.75; color:var(--ink); opacity:.85; }
  .result-actions{ margin-top:4px; display:flex; flex-direction:column; gap:12px; width:100%; align-items:center; }
  .cta-btn{
    display:inline-block; width:100%; max-width:270px; text-align:center; text-decoration:none;
    background:var(--sage); color:#FFFFFF; font-weight:700; font-size:16.5px;
    padding:14px 18px; border-radius:999px;
    box-shadow:0 10px 18px -10px rgba(159,180,149,.7);
  }
  .coupon-get-btn{
    background:var(--rose-deep); color:#fff;
    box-shadow:0 10px 18px -10px rgba(217,119,107,.6);
  }
  .reset-btn{
    background:none; border:none; font-size:14px; font-weight:500;
    color:var(--ink); text-decoration:underline; cursor:pointer; padding:4px;
    opacity:.75;
  }
  .card:focus-visible, .cta-btn:focus-visible, .reset-btn:focus-visible{
    outline:3px solid var(--gold); outline-offset:2px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="intro">
    <h1>おそろい さがし</h1>
    <p class="lead">カードを 2まい めくって、おなじ えを さがそう。<br>チャンスは 2かいだよ！</p>
  </div>

  <div class="tries" id="tries" aria-hidden="true">
    <p class="tries-label">チャンス</p>
    <span class="try-dot" id="tryDot0"><svg viewBox="0 0 24 24" fill="#D9776B"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.4 4.5 6 4.5c2 0 3.6 1.1 4.5 2.7C11.4 5.6 13 4.5 15 4.5c3.6 0 5.5 3.5 4 7.2C19.5 16.4 12 21 12 21Z"/></svg></span>
    <span class="try-dot" id="tryDot1"><svg viewBox="0 0 24 24" fill="#D9776B"><path d="M12 21s-7.5-4.6-10-9.3C.5 8 2.4 4.5 6 4.5c2 0 3.6 1.1 4.5 2.7C11.4 5.6 13 4.5 15 4.5c3.6 0 5.5 3.5 4 7.2C19.5 16.4 12 21 12 21Z"/></svg></span>
  </div>

  <div class="board" id="board"></div>

  <p class="feedback" id="feedback" aria-live="polite"></p>

  <div class="stage-wrap" id="stageWrap" hidden>
    <div class="stage" id="stage">
      <svg class="scene" id="sceneSvg" viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      <div class="petals" id="petals" aria-hidden="true"></div>
    </div>
  </div>

  <div class="reveal-wait" id="revealWait" hidden>
    <p id="revealWaitText">けっかを たしかめてるよ…</p>
  </div>

  <div class="result" id="result" hidden>
    <p class="result-title" id="resultTitle"></p>
    <p class="result-coupon" id="resultCoupon"></p>
    <p class="result-body" id="resultBody">今日も げんきに あそぼうね！</p>
    <div class="result-actions">
      <a class="cta-btn coupon-get-btn" href="#" target="_blank" rel="noopener" id="couponGetBtn" hidden>クーポンを受け取る</a>
      <a class="cta-btn" href="index.html#shopping" target="_top" id="ctaBtn">おでかけアイテムを見る</a>
      <button class="reset-btn" id="resetBtn" type="button">もういちど あそぶ</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ==========================================================
  // ▼▼▼ カードの絵柄設定（ここにPNG画像ファイル名を入れてください） ▼▼▼
  // このHTMLと同じフォルダに画像ファイルを置いて、ファイル名を
  // ''の中に書き換えてください（例: 'card-scarf.png'）。
  // 透過PNG・正方形に近い比率を推奨します。空のままだと仮の
  // プレースホルダー（丸に番号）が表示されます。
  var CARD_IMAGES = [
    '',  // 1種類目の絵柄
    '',  // 2種類目の絵柄
    ''   // 3種類目の絵柄
  ];
  // ▲▲▲ ここまで ▲▲▲
  // ==========================================================

  // ==========================================================
  // ▼▼▼ クーポンのリンク設定（ここに3種類のURLを貼ってください） ▼▼▼
  // 1等・2等・3等それぞれの「クーポンを取得する」ページのURLを
  // ""の中に貼り付けてください（例: 'https://coupon.rakuten.co.jp/...'）。
  // 空のままだと「クーポンを受け取る」ボタンは表示されません。
  var COUPON_URLS = {
    first:  '',  // 1等（100円OFF）のクーポン取得URL
    second: '',  // 2等（55円OFF）のクーポン取得URL
    third:  '',  // 3等（39円OFF）のクーポン取得URL
    miss:   ''   // ざんねん賞（10円OFF）のクーポン取得URL
  };
  // ▲▲▲ ここまで ▲▲▲
  // ==========================================================

  var board = document.getElementById('board');
  var feedback = document.getElementById('feedback');
  var tryDots = [document.getElementById('tryDot0'), document.getElementById('tryDot1')];
  var stageWrap = document.getElementById('stageWrap');
  var sceneSvg = document.getElementById('sceneSvg');
  var petalsWrap = document.getElementById('petals');
  var revealWait = document.getElementById('revealWait');
  var revealWaitText = document.getElementById('revealWaitText');
  var resultPanel = document.getElementById('result');
  var resultTitle = document.getElementById('resultTitle');
  var resultCoupon = document.getElementById('resultCoupon');
  var resultBody = document.getElementById('resultBody');
  var couponGetBtn = document.getElementById('couponGetBtn');
  var resetBtn = document.getElementById('resetBtn');
  var petalColors = ['#E8A9A0', '#C9A15A', '#9FB495', '#FFFFFF'];

  var COUPON_TIERS = {
    first:  { label:'1等', amount:'100', accent:'#D9776B' },
    second: { label:'2等', amount:'55',  accent:'#C9A15A' },
    third:  { label:'3等', amount:'39',  accent:'#9FB495' }
  };
  var MISS_TIER = { label:'ざんねん賞', amount:'10', accent:'#B7A99A' };

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickCouponOutcome(){
    var r = Math.random();
    if(r < 0.03) return 'first';
    if(r < 0.63) return 'second';
    return 'third';
  }

  function spawnPetals(count){
    petalsWrap.innerHTML = '';
    for(var i = 0; i < count; i++){
      var el = document.createElement('div');
      el.className = 'petal';
      el.style.left = (Math.random() * 92) + '%';
      el.style.background = petalColors[i % petalColors.length];
      el.style.animationDuration = (2.2 + Math.random() * 1.4) + 's';
      el.style.animationDelay = (Math.random() * 0.5) + 's';
      petalsWrap.appendChild(el);
    }
  }

  function revealScene(tier){
    var accent = tier.accent;
    sceneSvg.innerHTML = ''
      + '<rect width="320" height="400" fill="#FFF8F0"/>'
      + '<g fill="' + accent + '" opacity="0.18">'
      + '<circle cx="50" cy="70" r="8"/><circle cx="264" cy="56" r="6"/><circle cx="270" cy="320" r="7"/><circle cx="44" cy="336" r="6"/>'
      + '</g>'
      + '<g transform="translate(160,205)">'
      + '<path d="M-78 -50 Q-84 -58 -76 -64 L76 -64 Q84 -58 78 -50 L78 50 Q84 58 76 64 L-76 64 Q-84 58 -78 50 Z" fill="#FFFFFF" stroke="' + accent + '" stroke-width="3"/>'
      + '<circle cx="-78" cy="0" r="9" fill="#FFF8F0" stroke="' + accent + '" stroke-width="3"/>'
      + '<circle cx="78" cy="0" r="9" fill="#FFF8F0" stroke="' + accent + '" stroke-width="3"/>'
      + '<text y="14" text-anchor="middle" font-family="Jost, sans-serif" font-weight="600" font-size="46" fill="' + accent + '">' + tier.amount + '</text>'
      + '</g>'
      + '<text x="160" y="300" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-weight="900" font-size="22" fill="' + accent + '">' + tier.label + '</text>';
  }

  function showResult(tier, isMiss){
    resultTitle.textContent = tier.label + (isMiss ? '' : '！おめでとう！');
    resultCoupon.innerHTML = '<span class="coupon-badge">GOGOクーポン <span class="num">' + tier.amount + '</span>円OFF</span> プレゼント♪';
    resultBody.textContent = isMiss ? 'また あそびに きてね。つぎは あたるかも！' : 'すごい！おそろいを みつけられたね！';
    var couponUrl = isMiss ? COUPON_URLS.miss : COUPON_URLS[Object.keys(COUPON_TIERS).find(function(k){ return COUPON_TIERS[k] === tier; })];
    if(couponUrl){
      couponGetBtn.href = couponUrl;
      couponGetBtn.hidden = false;
    } else {
      couponGetBtn.hidden = true;
    }
    stageWrap.hidden = true;
    resultPanel.hidden = false;
    resultPanel.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function runReveal(isMiss){
    revealWaitText.textContent = isMiss ? 'ミニプレゼントを よういしてるよ…' : 'けっかを たしかめてるよ…';
    revealWait.hidden = false;
    setTimeout(function(){
      revealWait.hidden = true;
      stageWrap.hidden = false;
      var outcome = isMiss ? null : pickCouponOutcome();
      var tier = isMiss ? MISS_TIER : COUPON_TIERS[outcome];
      revealScene(tier);
      spawnPetals(isMiss ? 8 : (outcome === 'first' ? 22 : outcome === 'second' ? 16 : 10));
      setTimeout(function(){ showResult(tier, isMiss); }, 750);
    }, 900);
  }

  var cards = [];
  var flipped = [];
  var triesUsed = 0;
  var resolving = false;
  var matchedCount = 0;

  function buildCards(){
    var pairKeys = [0, 1, 2];
    var deck = shuffle(pairKeys.concat(pairKeys));
    return deck.map(function(key, i){ return { key:key, index:i, matched:false, flipped:false }; });
  }

  function renderTries(){
    tryDots.forEach(function(dot, i){
      dot.classList.toggle('used', i < triesUsed);
    });
  }

  function cardFaceContent(key){
    var src = CARD_IMAGES[key];
    if(src){
      return '<img src="' + src + '" alt="えがら">';
    }
    return '<div class="placeholder">' + (key + 1) + '</div>';
  }

  function renderBoard(){
    board.innerHTML = '';
    cards.forEach(function(card){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card';
      btn.setAttribute('aria-label', 'カード');
      btn.innerHTML = ''
        + '<div class="card-inner">'
        + '<div class="card-face card-back"></div>'
        + '<div class="card-face card-front">' + cardFaceContent(card.key) + '</div>'
        + '</div>';
      btn.addEventListener('click', function(){ onFlip(card, btn); });
      board.appendChild(btn);
    });
  }

  function onFlip(card, btn){
    if(resolving || card.flipped || card.matched || flipped.length >= 2) return;
    card.flipped = true;
    btn.classList.add('flipped');
    flipped.push({ card:card, btn:btn });
    feedback.textContent = '';

    if(flipped.length === 2){
      resolving = true;
      var a = flipped[0], b = flipped[1];
      if(a.card.key === b.card.key){
        setTimeout(function(){
          a.card.matched = true; b.card.matched = true;
          a.btn.classList.add('matched'); b.btn.classList.add('matched');
          matchedCount++;
          feedback.textContent = 'せいかい！おそろいだね！';
          flipped = [];
          resolving = false;
          setTimeout(function(){ runReveal(false); }, 500);
        }, 500);
      } else {
        triesUsed++;
        setTimeout(function(){
          a.btn.classList.add('wrong'); b.btn.classList.add('wrong');
        }, 350);
        setTimeout(function(){
          a.card.flipped = false; b.card.flipped = false;
          a.btn.classList.remove('flipped','wrong');
          b.btn.classList.remove('flipped','wrong');
          flipped = [];
          resolving = false;
          renderTries();
          if(triesUsed >= 2){
            feedback.textContent = 'ちょっと おしかったね';
            setTimeout(function(){ runReveal(true); }, 500);
          } else {
            feedback.textContent = 'もう1かい チャレンジ！';
          }
        }, 1300);
      }
    }
  }

  function startGame(){
    cards = buildCards();
    flipped = [];
    triesUsed = 0;
    resolving = false;
    matchedCount = 0;
    feedback.textContent = '';
    stageWrap.hidden = true;
    revealWait.hidden = true;
    resultPanel.hidden = true;
    renderTries();
    renderBoard();
  }

  resetBtn.addEventListener('click', startGame);

  startGame();

  function postHeight(){
    if(window.parent !== window){
      window.parent.postMessage({ type:'madoGameHeight', height: document.body.scrollHeight }, '*');
    }
  }
  window.addEventListener('load', postHeight);
  window.addEventListener('resize', postHeight);
  new MutationObserver(postHeight).observe(document.body, { childList:true, subtree:true, attributes:true });
})();
</script>
</body>
</html>
